<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <!-- 外枠：鎖リングをイメージした円形バッジ -->
  <circle cx="80" cy="85" r="75" fill="#003087" />
  <circle cx="80" cy="85" r="70" fill="none" stroke="#00aeef" stroke-width="4" stroke-dasharray="8 4" />
  <circle cx="80" cy="85" r="63" fill="#003087" />

  <!-- SECURITY ACTION テキスト（上部アーク） -->
  <path id="topArc" d="M 20,85 A 60,60 0 0,1 140,85" fill="none"/>
  <text font-size="11" font-weight="bold" fill="#ffffff" font-family="Arial,sans-serif" letter-spacing="1.5">
    <textPath href="#topArc" startOffset="8%">SECURITY ACTION</textPath>
  </text>

  <!-- セキュリティチェーンアイコン（中央） -->
  <circle cx="80" cy="78" r="22" fill="none" stroke="#00aeef" stroke-width="2.5"/>
  <circle cx="80" cy="78" r="15" fill="#00aeef" opacity="0.15"/>
  <!-- 盾アイコン -->
  <path d="M80 62 L93 68 L93 80 Q93 90 80 96 Q67 90 67 80 L67 68 Z" fill="none" stroke="#00aeef" stroke-width="2" stroke-linejoin="round"/>
  <path d="M74 78 L78 82 L87 72" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 区切り線 -->
  <line x1="30" y1="107" x2="130" y2="107" stroke="#00aeef" stroke-width="1" opacity="0.6"/>

  <!-- 二つ星 -->
  <text x="80" y="125" text-anchor="middle" font-size="22" fill="#FFD700" font-family="Arial,sans-serif">★★</text>

  <!-- 二つ星ラベル -->
  <text x="80" y="140" text-anchor="middle" font-size="9" fill="#00aeef" font-family="Arial,sans-serif" letter-spacing="0.5">二つ星</text>

  <!-- 下部：IPA -->
  <text x="80" y="155" text-anchor="middle" font-size="8" fill="#aaccee" font-family="Arial,sans-serif">独立行政法人 情報処理推進機構</text>
  <text x="80" y="165" text-anchor="middle" font-size="8" fill="#aaccee" font-family="Arial,sans-serif">IPA</text>
</svg>
